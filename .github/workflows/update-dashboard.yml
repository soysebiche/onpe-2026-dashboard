name: Update ONPE Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-onpe-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate dashboard snapshot
        run: |
          python onpe_dashboard.py \
            --state-file output/onpe_state_district_ci.json \
            --history-size 4

      - name: Commit updated artifacts
        id: commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html dashboard_data.json output/foreign_geo_names.json output/onpe_state_district_ci.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel production deploy
        if: steps.commit_changes.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "${VERCEL_DEPLOY_HOOK_URL}" ]; then
            curl --fail --silent --show-error -X POST "${VERCEL_DEPLOY_HOOK_URL}?buildCache=false"
          else
            echo "VERCEL_DEPLOY_HOOK_URL is not configured. GitHub data update succeeded, but Vercel still needs a manual deploy trigger."
          fi
