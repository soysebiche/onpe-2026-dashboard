name: Update ONPE Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-onpe-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate dashboard snapshot
        run: |
          python onpe_dashboard.py \
            --state-file output/onpe_state_district_ci.json \
            --history-size 4

      - name: Commit updated artifacts
        id: commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html dashboard_data.json output/foreign_geo_names.json output/onpe_state_district_ci.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel production
        if: steps.commit_changes.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Vercel secrets are missing. GitHub data update succeeded, but the production deploy was skipped."
            exit 0
          fi
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token "${VERCEL_TOKEN}"
          vercel deploy --prod --yes --token "${VERCEL_TOKEN}"
